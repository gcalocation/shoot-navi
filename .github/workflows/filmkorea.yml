name: 필름코리아 로케이션 자동 갱신

# 매일 새벽 3시(한국 시간)에 필름코리아 경기도 로케이션을 받아 data/filmkorea.json 을 갱신합니다.
# 바뀐 장소가 없으면 아무것도 올리지 않습니다. 손으로 돌리려면 GitHub 저장소의 Actions 탭에서 Run workflow.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 필름코리아 경기 로케이션 받기
        run: python3 tools/build_filmkorea.py data/filmkorea.json
      - name: 바뀐 것이 있으면 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/filmkorea.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "필름코리아 로케이션 복사본 자동 갱신"
            git push
          fi
